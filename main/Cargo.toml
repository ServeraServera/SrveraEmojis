[package]
name = "srvera-emoji"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
resvg = { version = "0.45", default-features = false }
rustybuzz = "0.20"
fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap", "fontconfig"] }
miniz_oxide = "0.8"
libc = "0.2"

[build-dependencies]
miniz_oxide = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
